name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: check
        run: npm run check:ci

      - name: build
        run: npm run build

      - name: test
        run: npm run test

      - name: check dist is up-to-date
        run: git diff --name-only --quiet --ignore-cr-at-eol --ignore-space-at-eol -- dist/index.js

      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
