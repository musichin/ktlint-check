name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: install
        run: npm ci

      - name: typecheck
        run: npm run typecheck

      - name: check
        run: npm run check:ci

      - name: build
        run: npm run build

      - name: test
        run: npm run test

      - name: check dist is up-to-date
        run: git diff --name-only --quiet --ignore-cr-at-eol --ignore-space-at-eol -- dist/index.js

      - uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: write clean file
        shell: bash
        run: |
          mkdir -p test/e2e
          cat > test/e2e/Clean.kt <<'EOF'
          package example

          val answer = 42
          EOF

      - name: clean code passes
        id: clean
        uses: ./
        continue-on-error: true
        with:
          patterns: test/e2e/**/*.kt

      - name: check clean code passed
        if: ${{ !cancelled() }}
        shell: bash
        run: test "${{ steps.clean.outcome }}" = success

      - name: write violating file
        shell: bash
        run: |
          cat > test/e2e/Violation.kt <<'EOF'
          package example

          val question = 42;
          EOF

      - name: violation fails
        id: violation
        uses: ./
        continue-on-error: true
        with:
          patterns: test/e2e/**/*.kt
          level: none

      - name: check violation failed
        if: ${{ !cancelled() }}
        shell: bash
        run: test "${{ steps.violation.outcome }}" = failure
