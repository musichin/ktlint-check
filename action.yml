
name: 'ktlint-check'
description: 'Run ktlint to check your code and annotate pull requests with errors'
author: 'Anton Musichin'
branding:
  icon: 'check'
  color: 'orange'
inputs:
  ktlint-version:
    required: true
    default: '1.8.0@sha256:a3fd620207d5c40da6ca789b95e7f823c54e854b7fade7f613e91096a3706d75'
    description: 'Version of ktlint, e.g. "1.8.0". Optionally followed by "@sha256:<checksum>" to verify the download.'
  level:
    required: true
    default: 'error'
    description: 'Annotation level for lint errors. Possible values: "error", "warning", "notice", "none"'


  # use "ktlint --help" for more information
  patterns:
    required: false
  code-style:
    required: false
    deprecationMessage: deprecated
  format:
    required: false
  limit:
    required: false
  ignore-autocorrect-failures:
    required: false
  relative:
    required: false
  reporter:
    required: false
  ruleset:
    required: false
  editorconfig:
    required: false
  experimental:
    required: false
  baseline:
    required: false
  log-level:
    required: false
  disabled_rules:
    required: false
    deprecationMessage: deprecated
  disabled-rules:
    required: false
    deprecationMessage: deprecated
runs:
  using: 'node24'
  main: 'dist/index.js'
